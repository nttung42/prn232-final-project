name: .NET CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore BadmintonBookingSystem.sln

    - name: Build
      run: dotnet build BadmintonBookingSystem.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test BadmintonBookingSystem.sln --configuration Release --no-build --verbosity normal
